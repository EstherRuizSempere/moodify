<div class="game-widget-container">
  <h3 class="game-widget-title">🚩 Buscaminas</h3>

  <div class="game-info">
    <div class="lives-counter">
      <span class="lives-label">Vidas:</span>
      <span class="lives-hearts">
        <span *ngFor="let heart of [].constructor(lives)" class="heart">❤️</span>
        <span *ngFor="let heart of [].constructor(3 - lives)" class="heart-lost">💔</span>
      </span>
    </div>

    <div class="game-controls">
      <button class="reset-btn" (click)="resetGame()">🔄 Nuevo Juego</button>
    </div>
  </div>

  <div class="game-status" *ngIf="gameStatus !== 'playing'">
    <div class="status-message"
         [class.won]="gameStatus === 'won'"
         [class.lost]="gameStatus === 'lost'">
      <span *ngIf="gameStatus === 'won'">🎉 ¡Felicidades! ¡Has ganado!</span>
      <span *ngIf="gameStatus === 'lost'">💥 ¡Game Over! ¡Inténtalo de nuevo!</span>
    </div>
  </div>

  <div class="game-widget-subtitle" *ngIf="gameStatus === 'playing'">
    Haz clic izquierdo para revelar. Clic derecho para marcar con bandera. ¡Evita las minas!
  </div>

  <div class="game-widget-content">
    <div class="minesweeper-grid">
      <button *ngFor="let cell of grid; index as i"
              [class]="getCellClass(cell)"
              (click)="revealCell(i)"
              (contextmenu)="flagCell($event, i)"
              [disabled]="gameStatus !== 'playing'">
        {{ getCellDisplay(cell) }}
      </button>
    </div>
  </div>
</div>
